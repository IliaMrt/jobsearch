<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="CLI collect screenshot">
  <rect width="920" height="420" rx="12" fill="#1e1e1e"/>
  <rect x="0" y="0" width="920" height="36" rx="12" fill="#2d2d2d"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="18" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text x="90" y="23" fill="#aaaaaa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">jobsearch-ts — collect</text>
  <text x="24" y="70" fill="#d4d4d4" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">
    <tspan x="24" dy="0">$ npm start -- --sources remotive,jobicy</tspan>
    <tspan x="24" dy="28" fill="#6a9955">=== source: remotive ===</tspan>
    <tspan x="24" dy="22">[remotive] search="nodejs"</tspan>
    <tspan x="24" dy="22" fill="#9cdcfe">  -&gt; api=16 kept=5</tspan>
    <tspan x="24" dy="28" fill="#6a9955">=== source: jobicy ===</tspan>
    <tspan x="24" dy="22">[jobicy] tag="typescript"</tspan>
    <tspan x="24" dy="22" fill="#9cdcfe">  -&gt; api=50 kept=10</tspan>
    <tspan x="24" dy="28">by_source: {"remotive":5,"jobicy":19}</tspan>
    <tspan x="24" dy="22" fill="#ce9178">collected=24 -&gt; output/raw_jobs.jsonl</tspan>
  </text>
</svg>
